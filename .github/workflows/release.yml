name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify & Build
        run: bun run verify

      # ── GitHub Release ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/adnify-cli.js

      # ── npm publish ───────────────────────────────
      # Uses OIDC Trusted Publishing if NPM_TOKEN is not set.
      # Falls back to NPM_TOKEN for the first publish (OIDC requires the package to already exist).
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN found — publishing with traditional token"
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm publish --access public
          else
            echo "NPM_TOKEN not found — publishing with OIDC Trusted Publishing"
            npm publish --provenance --access public
          fi
