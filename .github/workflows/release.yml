name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release metadata
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.GITHUB_REF_NAME!==expected){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+expected); process.exit(1)}"
          node -e "const {execSync}=require('node:child_process'); const [major,minor,patch]=execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(major<11||(major===11&&(minor<5||(minor===5&&patch<1)))){console.error('npm 11.5.1 or newer is required for trusted publishing'); process.exit(1)}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify & Build
        run: bun run verify

      - name: Inspect package contents
        run: npm pack --dry-run

      # Uses OIDC Trusted Publishing if NPM_TOKEN is not set.
      # Falls back to NPM_TOKEN for the first publish (OIDC requires the package to already exist).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN found — publishing with traditional token"
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN not found — publishing with OIDC Trusted Publishing"
            unset NODE_AUTH_TOKEN
            npm publish --access public
          fi

      # Create the GitHub release only after npm accepts the package. This avoids
      # advertising a release whose installable artifact failed to publish.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/adnify-cli.js --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
